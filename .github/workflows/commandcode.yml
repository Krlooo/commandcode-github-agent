name: commandcode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [assigned]
  workflow_dispatch:
    inputs:
      prompt:
        description: "Task for the Command Code agent to implement."
        required: true
        type: string

permissions:
  contents: read

# One run at a time per repository. Every run rebuilds the committed bundle, so
# two runs started from different issues both touch dist/index.js and their pull
# requests conflict by the time they meet. `queue: max` raises the pending queue
# from GitHub's default of a single run to 100, so queued runs wait their turn
# instead of silently cancelling each other.
concurrency:
  group: commandcode-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  commandcode:
    # Admit: a non-bot comment mentioning @commandcode-agent, an issue assigned
    # to a bot, or a manual run. This is a coarse gate; the handler's parser
    # applies the precise word-boundary rules.
    if: >-
      ((github.event_name == 'issue_comment' ||
      github.event_name == 'pull_request_review_comment') &&
      github.event.comment.user.type != 'Bot' &&
      contains(github.event.comment.body, '@commandcode-agent')) ||
      (github.event_name == 'issues' &&
      github.event.action == 'assigned' &&
      endsWith(github.event.assignee.login, '[bot]')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # The handler configures its own auth header (the app token) for
          # fetch/push; a persisted checkout credential would shadow it.
          persist-credentials: false

      # The app token replaces the workflow GITHUB_TOKEN for the agent: comments,
      # reactions and pushes carry the commandcode-agent[bot] identity, and -
      # unlike GITHUB_TOKEN - PRs opened with it DO trigger other workflows (CI).
      - name: Create the app token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # A second, read-only token handed to the agent so it can consult other
      # issues and pull requests with the gh CLI. The write token stays here.
      - name: Create a read-only token for the agent
        id: agent-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read

      - name: Run the Command Code agent
        uses: ./
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          agent-token: ${{ steps.agent-token.outputs.token }}
          verify-command: "npm ci && npm test && npm run typecheck"
          # Command Code API key from https://commandcode.ai/settings/keys, stored as
          # the AGENT_API_KEY secret. This is the documented CI auth path: the CLI
          # reads COMMAND_CODE_API_KEY at startup; no login is required.
          command-code-api-key: ${{ secrets.AGENT_API_KEY }}
          # Any model id from your Command Code plan (https://commandcode.ai/models).
          model: "deepseek/deepseek-v4.1-flash"
