name: "Command Code Agent"
description: "Run Command Code headless from an @commandcode-agent mention or an issue assignment: implementer + verification + reviewer pipeline that opens a pull request"
author: "Carlos Muñoz"

branding:
  icon: "cpu"
  color: "blue"

inputs:
  mentions:
    description: "Comma-separated trigger strings; a comment containing one of them at a word boundary starts the agent (default: @commandcode-agent)."
    required: false
    default: "@commandcode-agent"
  label:
    description: "Issue label that starts a run on an `issues: labeled` event. Leave empty (the default) so labeled events never start a run."
    required: false
  bot-login:
    description: "Login of the bot this action runs as, matched against the assignee of an `issues: assigned` event (e.g. commandcode-agent[bot]). Leave empty (the default) to resolve it from the token; if it cannot be resolved, issue assignments are ignored."
    required: false
  model:
    description: "Model identifier passed to the Command Code CLI (-m). Required when provider-api-key is set."
    required: false
  subagent-model:
    description: "Model pinned for subagents the agent delegates to, not the session model. Ignored when the model is not available to the account (subagents then inherit the session model)."
    required: false
  max-turns:
    description: "Maximum number of agent turns per agent run (implementer and reviewer)."
    required: false
    default: "100"
  agent-timeout-minutes:
    description: "Wall-clock limit for each agent (cmdc) process, in minutes. On expiry the process is killed and the timeout is reported through the normal failure path. Should stay below the job's timeout-minutes."
    required: false
    default: "40"
  verify-command:
    description: 'Command run to verify the change (e.g. "npm ci && npm test"); runs after the implementer agent, again after each repair attempt, and once more after the reviewer pass.'
    required: false
  review:
    description: "Run the reviewer agent pass after verification (true/false)."
    required: false
    default: "true"
  repair-attempts:
    description: "Bounded repair attempts when the verification command fails after the implementer pass; the failing output is handed back to the implementer and verification is re-run after each attempt (0 disables). Ignored when review is disabled."
    required: false
    default: "1"
  command-code-api-key:
    description: "Command Code API key (commandcode.ai/settings/keys), passed to the CLI as COMMAND_CODE_API_KEY. Recommended for CI; takes precedence over the BYOK provider inputs."
    required: false
  provider:
    description: "BYOK provider id written to ~/.commandcode/providers.json (e.g. openrouter)."
    required: false
  provider-base-url:
    description: "Base URL for the BYOK provider (e.g. https://openrouter.ai/api/v1)."
    required: false
  provider-api-key:
    description: "API key for the BYOK provider; provide it through a secret."
    required: false
  github-token:
    description: "Token used for the GitHub API and git push; defaults to the workflow token"
    required: false
  agent-token:
    description: "Optional read-only GitHub token exposed to the agent as GH_TOKEN so it can read issues and pull requests with the gh CLI. Generate it with actions/create-github-app-token restricted to read permissions."
    required: false

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: "22"
    - name: Install Command Code CLI
      shell: bash
      # Pinned for reproducible CI; the CLI requires Node >= 22 (ensured above).
      run: npm install -g command-code@1.66.0
    - name: Run Command Code agent
      shell: bash
      run: node "${{ github.action_path }}/dist/index.js"
      env:
        INPUT_MENTIONS: ${{ inputs.mentions }}
        INPUT_LABEL: ${{ inputs.label }}
        INPUT_BOT_LOGIN: ${{ inputs.bot-login }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_SUBAGENT_MODEL: ${{ inputs.subagent-model }}
        INPUT_MAX_TURNS: ${{ inputs.max-turns }}
        INPUT_AGENT_TIMEOUT_MINUTES: ${{ inputs.agent-timeout-minutes }}
        INPUT_VERIFY_COMMAND: ${{ inputs.verify-command }}
        INPUT_REVIEW: ${{ inputs.review }}
        INPUT_REPAIR_ATTEMPTS: ${{ inputs.repair-attempts }}
        INPUT_COMMAND_CODE_API_KEY: ${{ inputs.command-code-api-key }}
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_PROVIDER_BASE_URL: ${{ inputs.provider-base-url }}
        INPUT_PROVIDER_API_KEY: ${{ inputs.provider-api-key }}
        INPUT_AGENT_TOKEN: ${{ inputs.agent-token }}
        GITHUB_TOKEN: "${{ inputs.github-token != '' && inputs.github-token || github.token }}"
